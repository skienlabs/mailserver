# Skien Mails on the Skienlab server.
# Copy to ~/docker/apps/mailserver/docker-compose.yml on the server. The GitHub Actions
# workflow (.github/workflows/deploy.yml) builds the image, then pulls and restarts it here.
#
# Web app: Nginx Proxy Manager (on skiensuite-net) forwards mail.skienlab.com -> http://skienmail:8080
# Mail:    ports 25/587/465 are published on the host (NPM only proxies HTTP).

networks:
  skiensuite-net:
    name: skiensuite-net
    external: true

services:
  skienmail:
    image: us-central1-docker.pkg.dev/inspired-verve-293514/test-images/mailserver:latest
    container_name: skienmail
    restart: unless-stopped
    networks:
      - skiensuite-net
    ports:
      - "25:25"     # inbound mail from the internet (MX)
      - "587:587"   # submission (STARTTLS) for mail apps, printers, scripts
      - "465:465"   # submission (implicit TLS)
    environment:
      TZ: Asia/Kolkata
      SM_HOSTNAME: mail.skienlab.com
      # Optional: real TLS certificate for SMTP, reusing Nginx Proxy Manager's Let's Encrypt
      # certificate for mail.skienlab.com (npm-N = the certificate's ID in NPM). Without this a
      # self-signed certificate is used, which other mail servers accept.
      # SM_TLS_CERT: /certs/live/npm-N/fullchain.pem
      # SM_TLS_KEY: /certs/live/npm-N/privkey.pem
    # user: "0:0"   # needed together with the certificate mount (Let's Encrypt keys are root-only)
    volumes:
      - skienmail-data:/data
      # - /path/to/nginx-proxy-manager/letsencrypt:/certs:ro
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  skienmail-data:
